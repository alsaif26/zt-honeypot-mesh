networks:
  honeypot-mesh:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24

volumes:
  honeypot-logs:
    driver: local

services:

  ssh-honeypot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zt-ssh-honeypot
    restart: unless-stopped
    ports:
      - "2222:2222"
    volumes:
      - honeypot-logs:/app/logs
    environment:
      SSH_HOST: "0.0.0.0"
      SSH_PORT: "2222"
      LOG_DIR: "/app/logs"
      NODE_ID: "node-ssh-01"
      NODE_ROLE: "ssh-honeypot"
    networks:
      honeypot-mesh:
        ipv4_address: 172.20.0.10

  http-honeypot:
    build:
      context: .
      dockerfile: Dockerfile.http
    container_name: zt-http-honeypot
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - honeypot-logs:/app/logs
    environment:
      HTTP_PORT: "8080"
      LOG_DIR: "/app/logs"
      NODE_ID: "node-http-01"
      NODE_ROLE: "http-honeypot"
    networks:
      honeypot-mesh:
        ipv4_address: 172.20.0.11

  smb-honeypot:
    build:
      context: .
      dockerfile: Dockerfile.smb
    container_name: zt-smb-honeypot
    restart: unless-stopped
    ports:
      - "4445:4445"
    volumes:
      - honeypot-logs:/app/logs
    environment:
      SMB_PORT: "4445"
      LOG_DIR: "/app/logs"
      NODE_ID: "node-smb-01"
      NODE_ROLE: "smb-honeypot"
    networks:
      honeypot-mesh:
        ipv4_address: 172.20.0.12

  mesh-controller:
    build:
      context: .
      dockerfile: Dockerfile.analytics
    container_name: zt-mesh-controller
    restart: unless-stopped
    command: ["python", "-u", "mesh/controller.py"]
    volumes:
      - honeypot-logs:/app/logs
    environment:
      LOG_DIR: "/app/logs"
      NODE_ID: "node-mesh-01"
      NODE_ROLE: "mesh-controller"
      MAX_ATTEMPTS_PER_IP: "10"
    depends_on:
      - ssh-honeypot
      - http-honeypot
      - smb-honeypot
    networks:
      honeypot-mesh:
        ipv4_address: 172.20.0.13

  ai-detector:
    build:
      context: .
      dockerfile: Dockerfile.analytics
    container_name: zt-ai-detector
    restart: unless-stopped
    command: ["python", "-u", "ai/anomaly_detector.py"]
    volumes:
      - honeypot-logs:/app/logs
    environment:
      LOG_DIR: "/app/logs"
      NODE_ID: "node-ai-01"
      NODE_ROLE: "ai-detector"
    depends_on:
      - ssh-honeypot
      - http-honeypot
      - smb-honeypot
    networks:
      honeypot-mesh:
        ipv4_address: 172.20.0.14

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    container_name: zt-dashboard
    restart: unless-stopped
    ports:
      - "8888:8888"
    volumes:
      - honeypot-logs:/app/logs
    environment:
      LOG_DIR: "/app/logs"
      NODE_ID: "node-dashboard-01"
      NODE_ROLE: "dashboard"
      MAX_ATTEMPTS_PER_IP: "10"
      REFRESH_INTERVAL: "10"
      SSH_PROBE_HOST: "ssh-honeypot"
      SSH_PROBE_PORT: "2222"
      HTTP_PROBE_HOST: "http-honeypot"
      HTTP_PROBE_PORT: "8080"
      SMB_PROBE_HOST: "smb-honeypot"
      SMB_PROBE_PORT: "4445"
    depends_on:
      - ssh-honeypot
      - http-honeypot
      - smb-honeypot
    networks:
      honeypot-mesh:
        ipv4_address: 172.20.0.15
